<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="A Gemini-powered multimodal chatbot — text, images and PDFs in one conversation." />
  <title>Gemini Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 2 L19 13 L30 16 L19 19 L16 30 L13 19 L2 16 L13 13 Z' fill='%232f6bdf'/></svg>"
  />
  <style>
    :root {
      --ink: #0f1b2d;
      --ink-soft: #33425a;
      --mist: #6b7a90;
      --azure: #2f6bdf;
      --azure-deep: #1e4fb0;
      --azure-tint: #eef3fe;
      --paper: #f4f7fb;
      --panel: #ffffff;
      --line: #e4e9f2;
      --line-soft: #eef1f7;
      --gold: #e8a33d;
      --danger: #c0392b;
      --shadow: 0 1px 2px rgba(15,27,45,0.04), 0 10px 30px rgba(15,27,45,0.07);
      --sans: "Figtree", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      --serif: "Newsreader", Georgia, serif;
      --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background: var(--paper);
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; }

    /* ---------- Shell: flex, cannot overlap ---------- */
    .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ---------- Sidebar ---------- */
    .sidebar {
      width: 280px;
      flex: 0 0 280px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 14px; }
    .brand .spark { width: 24px; height: 24px; flex: none; animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .brand-name { font-family: var(--serif); font-size: 1.28rem; font-weight: 600; letter-spacing: -0.01em; }
    .brand-name b { color: var(--azure); font-weight: 600; }
    .new-chat {
      margin: 2px 16px 6px; padding: 11px 14px;
      border: 1px solid var(--line); background: var(--panel);
      border-radius: 12px; color: var(--ink); font-weight: 600; font-size: 0.92rem;
      display: flex; align-items: center; gap: 8px;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .new-chat:hover { border-color: var(--azure); background: var(--azure-tint); color: var(--azure-deep); }
    .rail-label { padding: 14px 20px 8px; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mist); font-weight: 700; }
    .history { flex: 1 1 auto; overflow-y: auto; padding: 0 12px 12px; min-height: 0; }
    .history-item {
      display: block; width: 100%; text-align: left; background: transparent; border: none;
      border-radius: 10px; padding: 9px 12px; color: var(--ink-soft); font-size: 0.9rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: background 0.15s, color 0.15s;
    }
    .history-item:hover { background: var(--line-soft); color: var(--ink); }
    .history-empty { padding: 6px 20px; color: var(--mist); font-size: 0.85rem; line-height: 1.5; }
    .rail-foot { padding: 13px 20px; border-top: 1px solid var(--line); font-size: 0.78rem; color: var(--mist); display: flex; align-items: center; gap: 8px; flex: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: none; }
    .dot.live { background: #22a565; }

    /* ---------- Main ---------- */
    .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 12px; padding: 15px 24px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
    .topbar h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.24rem; letter-spacing: -0.01em; white-space: nowrap; }
    .model-chip { font-family: var(--mono); font-size: 0.72rem; color: var(--azure-deep); background: var(--azure-tint); padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .spacer { flex: 1; }
    .menu-btn { display: none; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); place-items: center; flex: none; }

    .thread { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding: 26px 0 6px; }
    .thread-inner { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 24px; }

    .msg { display: flex; gap: 13px; margin-bottom: 24px; animation: rise 0.3s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .avatar { width: 30px; height: 30px; flex: none; border-radius: 8px; display: grid; place-items: center; }
    .avatar.bot { background: var(--azure-tint); }
    .avatar.you { background: var(--ink); color: #fff; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; }
    .bubble { flex: 1 1 auto; min-width: 0; }
    .role { font-size: 0.76rem; font-weight: 700; color: var(--mist); margin: 4px 0 6px; }
    .msg.you .role { color: var(--azure-deep); }

    /* message body typography (markdown-rendered) */
    .body { font-size: 0.98rem; line-height: 1.65; color: var(--ink); overflow-wrap: break-word; word-break: break-word; }
    .body > *:first-child { margin-top: 0; }
    .body > *:last-child { margin-bottom: 0; }
    .body p { margin: 0 0 12px; }
    .body h3, .body h4, .body h5 { font-family: var(--serif); font-weight: 600; line-height: 1.3; margin: 18px 0 8px; }
    .body h3 { font-size: 1.18rem; }
    .body h4 { font-size: 1.06rem; }
    .body h5 { font-size: 0.98rem; }
    .body ul, .body ol { margin: 0 0 12px; padding-left: 22px; }
    .body li { margin: 5px 0; }
    .body li::marker { color: var(--mist); }
    .body strong { font-weight: 700; color: var(--ink); }
    .body em { font-style: italic; }
    .body a { color: var(--azure); text-decoration: underline; text-underline-offset: 2px; }
    .body code.inline { font-family: var(--mono); font-size: 0.86em; background: var(--line-soft); padding: 1px 6px; border-radius: 6px; color: var(--azure-deep); }
    .body pre.code { font-family: var(--mono); font-size: 0.85rem; line-height: 1.55; background: #0f1b2d; color: #e8eefb; padding: 14px 16px; border-radius: 12px; overflow-x: auto; margin: 4px 0 12px; }
    .body pre.code code { font-family: inherit; background: none; padding: 0; color: inherit; }
    .body blockquote { margin: 0 0 12px; padding: 4px 0 4px 14px; border-left: 3px solid var(--line); color: var(--ink-soft); }
    .body img.attach { display: block; max-width: 280px; border-radius: 12px; margin-top: 10px; border: 1px solid var(--line); }
    .body .file-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--line-soft); color: var(--ink-soft); border-radius: 8px; padding: 4px 10px; font-size: 0.84rem; margin-top: 8px; }

    .typing { display: inline-flex; gap: 5px; padding: 6px 0; }
    .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--azure); animation: bob 1.1s infinite ease-in-out both; }
    .typing i:nth-child(2) { animation-delay: 0.16s; }
    .typing i:nth-child(3) { animation-delay: 0.32s; }
    @keyframes bob { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    /* welcome */
    .welcome { text-align: center; padding: 30px 20px 8px; }
    .welcome .spark { width: 44px; height: 44px; margin: 0 auto 14px; animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(47,107,223,0)); } 50% { filter: drop-shadow(0 0 12px rgba(47,107,223,0.4)); } }
    .welcome h2 { font-family: var(--serif); font-weight: 500; font-size: 1.65rem; margin: 0 0 8px; }
    .welcome p { color: var(--mist); margin: 0 auto 20px; max-width: 440px; line-height: 1.6; }
    .suggests { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .suggest { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 0.9rem; color: var(--ink-soft); max-width: 220px; transition: border-color 0.15s, transform 0.15s, color 0.15s; }
    .suggest:hover { border-color: var(--azure); transform: translateY(-2px); color: var(--ink); }
    .suggest b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }

    /* composer */
    .composer { padding: 12px 24px 20px; border-top: 1px solid var(--line); background: var(--paper); flex: none; }
    .composer-inner { width: 100%; max-width: 760px; margin: 0 auto; }
    .attach-preview { display: none; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; }
    .attach-preview img { width: 42px; height: 42px; object-fit: cover; border-radius: 8px; }
    .attach-preview .name { font-size: 0.86rem; color: var(--ink-soft); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-preview button { border: none; background: transparent; color: var(--mist); font-size: 1.05rem; padding: 2px 6px; }
    .attach-preview button:hover { color: var(--danger); }
    .field { display: flex; align-items: flex-end; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 7px 7px 7px 10px; box-shadow: var(--shadow); transition: border-color 0.15s; }
    .field:focus-within { border-color: var(--azure); }
    .icon-btn { width: 38px; height: 38px; flex: none; border: none; background: transparent; border-radius: 10px; color: var(--mist); display: grid; place-items: center; transition: background 0.15s, color 0.15s; }
    .icon-btn:hover { background: var(--line-soft); color: var(--azure-deep); }
    .icon-btn.rec { color: #fff; background: var(--danger); }
    #input { flex: 1 1 auto; min-width: 0; border: none; outline: none; resize: none; font-family: inherit; font-size: 0.98rem; color: var(--ink); line-height: 1.5; max-height: 168px; padding: 9px 4px; background: transparent; }
    #input::placeholder { color: var(--mist); }
    .send { width: 40px; height: 40px; flex: none; border: none; border-radius: 12px; background: var(--azure); color: #fff; display: grid; place-items: center; transition: background 0.15s, transform 0.1s; }
    .send:hover { background: var(--azure-deep); }
    .send:active { transform: scale(0.94); }
    .send:disabled { background: var(--line); color: var(--mist); cursor: default; }
    .hint { text-align: center; font-size: 0.75rem; color: var(--mist); margin: 9px 0 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    .scrim { position: fixed; inset: 0; background: rgba(15,27,45,0.42); z-index: 40; display: none; }
    .scrim.show { display: block; }

    /* ---------- Mobile: sidebar becomes an off-canvas drawer ---------- */
    @media (max-width: 860px) {
      .sidebar {
        position: fixed; top: 0; bottom: 0; left: 0; width: 280px; flex: none;
        transform: translateX(-100%);
        visibility: hidden;                 /* guarantees no overlap when closed */
        transition: transform 0.26s ease, visibility 0.26s;
        z-index: 50; box-shadow: var(--shadow);
      }
      .sidebar.open { transform: none; visibility: visible; }
      .menu-btn { display: grid; }
      .thread-inner, .composer-inner { padding-left: 18px; padding-right: 18px; }
      .topbar { padding: 13px 16px; }
      .topbar h1 { font-size: 1.12rem; }
    }
    @media (max-width: 420px) {
      .model-chip { display: none; }
      .body img.attach { max-width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="spark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L19.2 12.8 L30 16 L19.2 19.2 L16 30 L12.8 19.2 L2 16 L12.8 12.8 Z" fill="var(--azure)"/></svg>
        <div class="brand-name">Gemini<b>·</b>chat</div>
      </div>
      <button class="new-chat" id="new-chat">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
      <div class="rail-label">History</div>
      <div class="history" id="history"></div>
      <div class="rail-foot"><span class="dot" id="status-dot"></span><span id="status-text">Checking backend…</span></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 id="topbar-title">New conversation</h1>
        <span class="spacer"></span>
        <span class="model-chip" id="model-chip">gemini-3.5-flash</span>
      </header>

      <section class="thread" id="thread"><div class="thread-inner" id="thread-inner"></div></section>

      <div class="composer">
        <div class="composer-inner">
          <div class="attach-preview" id="attach-preview">
            <img id="attach-thumb" alt="" />
            <span class="name" id="attach-name"></span>
            <button id="attach-clear" aria-label="Remove attachment">✕</button>
          </div>
          <div class="field">
            <input type="file" id="image-input" accept="image/*" class="sr-only" />
            <input type="file" id="pdf-input" accept="application/pdf" class="sr-only" />
            <button class="icon-btn" id="image-btn" title="Attach image" aria-label="Attach image">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.6"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
            <button class="icon-btn" id="pdf-btn" title="Attach PDF" aria-label="Attach PDF">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            </button>
            <textarea id="input" rows="1" placeholder="Ask anything — attach an image or PDF to go multimodal…"></textarea>
            <button class="icon-btn" id="mic-btn" title="Voice input" aria-label="Voice input">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4"/></svg>
            </button>
            <button class="send" id="send-btn" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
            </button>
          </div>
          <p class="hint">Gemini can make mistakes. Verify important information.</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const threadInner = $("#thread-inner");
    const input = $("#input");
    const sendBtn = $("#send-btn");
    let backendLive = false;

    const SPARK_SM = `<svg viewBox="0 0 32 32" style="width:17px;height:17px" aria-hidden="true"><path d="M16 2 L19.2 12.8 L30 16 L19.2 19.2 L16 30 L12.8 19.2 L2 16 L12.8 12.8 Z" fill="var(--azure)"/></svg>`;

    /* ---------------- Markdown rendering ---------------- */
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function inlineMd(s) {
      // inline code first (protect its contents)
      const codes = [];
      s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return "\u0001" + (codes.length - 1) + "\u0001"; });
      s = escapeHtml(s);
      // links [text](url)
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      // bold then italic
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      s = s.replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*/g, "$1<em>$2</em>");
      s = s.replace(/(^|[^_\w])_(?!\s)([^_\n]+?)_/g, "$1<em>$2</em>");
      // restore inline code
      s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code class="inline">' + escapeHtml(codes[+i]) + "</code>");
      return s;
    }
    function renderMarkdown(md) {
      md = md.replace(/\r\n/g, "\n");
      // fenced code blocks
      const blocks = [];
      md = md.replace(/```[^\n]*\n?([\s\S]*?)```/g, (m, code) => {
        blocks.push('<pre class="code"><code>' + escapeHtml(code.replace(/\n$/, "")) + "</code></pre>");
        return "\u0002" + (blocks.length - 1) + "\u0002";
      });

      const lines = md.split("\n");
      let html = "", list = null; // list = 'ul' | 'ol' | null
      const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };

      for (let raw of lines) {
        const line = raw.replace(/\s+$/, "");
        let m;
        if ((m = line.match(/^\u0002(\d+)\u0002$/))) { closeList(); html += blocks[+m[1]]; continue; }
        if (line.trim() === "") { closeList(); continue; }
        if ((m = line.match(/^(#{1,5})\s+(.*)$/))) {
          closeList();
          const lvl = m[1].length <= 2 ? 3 : 4; // #/## -> h3, ###+ -> h4
          html += "<h" + lvl + ">" + inlineMd(m[2]) + "</h" + lvl + ">";
          continue;
        }
        if ((m = line.match(/^\s*>\s?(.*)$/))) { closeList(); html += "<blockquote>" + inlineMd(m[1]) + "</blockquote>"; continue; }
        if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
          if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
          html += "<li>" + inlineMd(m[1]) + "</li>"; continue;
        }
        if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
          if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
          html += "<li>" + inlineMd(m[1]) + "</li>"; continue;
        }
        closeList();
        html += "<p>" + inlineMd(line) + "</p>";
      }
      closeList();
      return html;
    }

    /* ---------------- Messages ---------------- */
    function addMessage({ role, text, imageSrc, fileName }) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + (role === "you" ? "you" : "bot");
      wrap.innerHTML =
        (role === "you" ? '<div class="avatar you">YOU</div>' : '<div class="avatar bot">' + SPARK_SM + "</div>") +
        '<div class="bubble"><div class="role">' + (role === "you" ? "You" : "Gemini") + '</div><div class="body"></div></div>';
      const body = wrap.querySelector(".body");
      if (role === "you") {
        if (text) { const p = document.createElement("p"); p.textContent = text; body.appendChild(p); }
      } else if (text) {
        body.innerHTML = renderMarkdown(text);
      }
      if (imageSrc) { const img = document.createElement("img"); img.className = "attach"; img.src = imageSrc; img.alt = "attachment"; body.appendChild(img); }
      if (fileName) { const t = document.createElement("span"); t.className = "file-tag"; t.textContent = "📄 " + fileName; body.appendChild(t); }
      threadInner.appendChild(wrap);
      scrollDown();
      return wrap;
    }
    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.innerHTML = '<div class="avatar bot">' + SPARK_SM + '</div><div class="bubble"><div class="role">Gemini</div><div class="body"><div class="typing"><i></i><i></i><i></i></div></div></div>';
      threadInner.appendChild(wrap); scrollDown(); return wrap;
    }
    function scrollDown() { const t = $("#thread"); t.scrollTop = t.scrollHeight; }
    function clearThread() { threadInner.innerHTML = ""; $("#topbar-title").textContent = "New conversation"; showWelcome(); closeSidebar(); }

    /* ---------------- Welcome ---------------- */
    const EXAMPLES = [
      { title: "Explain a concept", body: "Explain gradient boosting like I'm new to ML." },
      { title: "Summarize a PDF", body: "Attach a report and ask for a 5-point summary." },
      { title: "Describe an image", body: "Attach a photo and ask what's in it." },
    ];
    function showWelcome() {
      const w = document.createElement("div");
      w.className = "welcome";
      w.innerHTML =
        '<svg class="spark" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 L19.2 12.8 L30 16 L19.2 19.2 L16 30 L12.8 19.2 L2 16 L12.8 12.8 Z" fill="var(--azure)"/></svg>' +
        "<h2>How can I help today?</h2>" +
        "<p>Chat with Google's Gemini models. Attach an <b>image</b> or <b>PDF</b> and I'll reason over it in the same conversation.</p>" +
        '<div class="suggests"></div>';
      const s = w.querySelector(".suggests");
      EXAMPLES.forEach((ex) => {
        const b = document.createElement("button");
        b.className = "suggest";
        b.innerHTML = "<b></b>";
        b.querySelector("b").textContent = ex.title;
        b.appendChild(document.createTextNode(ex.body));
        b.onclick = () => { input.value = ex.body; input.focus(); autoGrow(); };
        s.appendChild(b);
      });
      threadInner.appendChild(w);
    }
    function removeWelcome() { const w = threadInner.querySelector(".welcome"); if (w) w.remove(); }

    /* ---------------- History list ---------------- */
    function renderHistoryList(items) {
      const box = $("#history");
      box.innerHTML = "";
      if (!items.length) { box.innerHTML = '<div class="history-empty">Your messages will appear here once you start chatting.</div>'; return; }
      items.slice().reverse().forEach((it) => {
        const b = document.createElement("button");
        b.className = "history-item";
        b.textContent = it.prompt || "(attachment)";
        b.title = it.prompt || "";
        b.onclick = () => { input.value = it.prompt || ""; input.focus(); autoGrow(); closeSidebar(); };
        box.appendChild(b);
      });
    }

    /* ---------------- Init ---------------- */
    async function init() {
      showWelcome();
      try {
        const res = await fetch("/api/history");
        if (!res.ok) throw new Error("no backend");
        const data = await res.json();
        backendLive = true;
        setStatus(true, data.model);
        if (data.model) $("#model-chip").textContent = data.model;
        renderHistoryList(data.history || []);
        if ((data.history || []).length) {
          removeWelcome();
          data.history.forEach((it) => {
            addMessage({ role: "you", text: it.prompt, imageSrc: it.image ? "data:image/png;base64," + it.image : null });
            addMessage({ role: "bot", text: it.response });
          });
          $("#topbar-title").textContent = "Conversation";
        }
      } catch (e) {
        backendLive = false;
        setStatus(false);
        renderHistoryList([]);
      }
    }
    function setStatus(live, model) {
      const dot = $("#status-dot"), txt = $("#status-text");
      if (live) { dot.classList.add("live"); txt.textContent = "Connected · " + (model || "gemini"); }
      else { dot.classList.remove("live"); txt.textContent = "Preview mode · backend offline"; }
    }

    /* ---------------- Attachments ---------------- */
    let pending = { image: null, pdf: null };
    $("#image-btn").onclick = () => $("#image-input").click();
    $("#pdf-btn").onclick = () => $("#pdf-input").click();
    $("#image-input").onchange = function () {
      if (!this.files[0]) return;
      pending = { image: this.files[0], pdf: null }; $("#pdf-input").value = "";
      const r = new FileReader(); r.onload = (e) => showAttach(e.target.result, this.files[0].name, true); r.readAsDataURL(this.files[0]);
    };
    $("#pdf-input").onchange = function () {
      if (!this.files[0]) return;
      pending = { image: null, pdf: this.files[0] }; $("#image-input").value = ""; showAttach(null, this.files[0].name, false);
    };
    function showAttach(src, name, isImage) {
      const thumb = $("#attach-thumb");
      if (isImage) { thumb.src = src; thumb.style.display = "block"; } else { thumb.style.display = "none"; }
      $("#attach-name").textContent = name; $("#attach-preview").style.display = "flex";
    }
    $("#attach-clear").onclick = clearAttach;
    function clearAttach() { pending = { image: null, pdf: null }; $("#image-input").value = ""; $("#pdf-input").value = ""; $("#attach-preview").style.display = "none"; }

    /* ---------------- Send ---------------- */
    async function send() {
      const text = input.value.trim();
      if (!text && !pending.image && !pending.pdf) return;
      removeWelcome();
      $("#topbar-title").textContent = "Conversation";

      let thumbSrc = pending.image ? $("#attach-thumb").src : null;
      addMessage({ role: "you", text, imageSrc: thumbSrc, fileName: pending.pdf ? pending.pdf.name : null });

      const fd = new FormData();
      fd.append("prompt", text);
      if (pending.image) fd.append("image", pending.image);
      if (pending.pdf) fd.append("pdf_file", pending.pdf);

      input.value = ""; autoGrow(); clearAttach();
      const typing = addTyping(); sendBtn.disabled = true;

      if (!backendLive) {
        setTimeout(() => {
          typing.remove();
          addMessage({ role: "bot", text: "This is a preview — the Python backend isn't running, so I can't reach Gemini yet.\n\nTo get live answers:\n\n1. `pip install -r requirements.txt`\n2. Add your key to `.env`\n3. `python app.py` — then open http://localhost:5000" });
          sendBtn.disabled = false;
        }, 450);
        return;
      }
      try {
        const res = await fetch("/api/chat", { method: "POST", body: fd });
        const data = await res.json();
        typing.remove();
        if (!res.ok) addMessage({ role: "bot", text: data.error || "Something went wrong. Please try again." });
        else { addMessage({ role: "bot", text: data.response }); refreshHistory(); }
      } catch (e) {
        typing.remove();
        addMessage({ role: "bot", text: "Couldn't reach the server. Is the backend still running?" });
      } finally { sendBtn.disabled = false; }
    }
    async function refreshHistory() {
      try { const res = await fetch("/api/history"); const data = await res.json(); renderHistoryList(data.history || []); } catch (e) {}
    }

    /* ---------------- Input UX ---------------- */
    function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 168) + "px"; }
    input.addEventListener("input", autoGrow);
    input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    sendBtn.onclick = send;
    $("#new-chat").onclick = clearThread;

    /* ---------------- Drawer ---------------- */
    function openSidebar() { $("#sidebar").classList.add("open"); $("#scrim").classList.add("show"); }
    function closeSidebar() { $("#sidebar").classList.remove("open"); $("#scrim").classList.remove("show"); }
    $("#menu-btn").onclick = openSidebar;
    $("#scrim").onclick = closeSidebar;

    /* ---------------- Voice ---------------- */
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const micBtn = $("#mic-btn");
    if (SR) {
      const rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
      let on = false;
      rec.onresult = (e) => { input.value = e.results[e.resultIndex][0].transcript; autoGrow(); };
      rec.onend = () => { on = false; micBtn.classList.remove("rec"); };
      micBtn.onclick = () => { on ? rec.stop() : (rec.start(), (on = true), micBtn.classList.add("rec")); };
    } else { micBtn.style.opacity = 0.4; micBtn.title = "Voice input isn't supported in this browser"; }

    init();
  </script>
</body>
</html>
